[project]
name = "exosuit_python"
version = "0.0.3"
description = "IMU sensor codes in Python for the exosuit"
readme = "README.md"
authors = [{ name = "Tsmorz", email = "tony.smoragiewicz@tum.de" },{ name = "Zhongge Lin", email = "zg.lin@outlook.com" },{ name = "Haoqing Yang", email = "Yang_Haoqing@outlook.com" }]
requires-python = ">=3.11"
homepage = "https://github.com/TUM-Aries-Lab/exosuit-python"

# --- Core dependencies: NO hardware here ---
dependencies = [
  "numpy>=2.2.3",
  "loguru>=0.7.3",
  "motor-python>=0.0.4",
  "imu-python>=0.0.12",
  "hip-controller>=0.0.4",
]

[dependency-groups]
dev = [
  "ruff>=0.6.9",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pre-commit>=4.1.0",
  "coveralls>=4.0.1",
  "pyright>=1.1.407",
]
hw = [
  "jetson-gpio>=2.1.12",
  "adafruit-extended-bus>=1.0.2",
  "adafruit-circuitpython-bno055>=5.4.20",
  "adafruit-circuitpython-lsm6ds>=4.5.18",
]
no_hw = [
]

[tool.ruff]
line-length = 88
fix = true

lint.select = [
  "E","F","W","C90","I","N","D","UP","B","S","YTT","Q","PL","RUF","T20","F841","ERA001",
]

lint.ignore = [
  "D203","D213","E501","N803","N806","D415","S101","E203","E731",
  "D107","PLR2004","S607","S605","S603",
]

[tool.ruff.lint.isort]
known-first-party = ["exosuit_python"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# Tell hatchling where the package lives (src layout)
[tool.hatch.build.targets.wheel]
packages = ["src/exosuit_python"]

[tool.hatch.build.targets.sdist]
include = [
  "src/exosuit_python",
  "README.md",
  "LICENSE",
]
